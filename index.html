<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <title>Architecture of Light + Color</title>
  <style>
    body {
      margin: 0;
      font-family: Helvetica, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: normal;
      margin-bottom: 3rem;
      color: #111;
    }

    .icon-container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }

    .icon-link {
      width: 180px;
      height: 180px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: #f0f0f0;
    }

    .icon-link:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
    }

    .icon-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .icon-title {
      margin-top: 0.75rem;
      font-size: 1rem;
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Architecture of Light + Color</h1>

  <div class="icon-container">
    <a href="https://paleblaze.com/" class="icon-item">
      <div class="icon-link">
        <img src="https://framerusercontent.com/images/O0LfZIObZe1dOYFnWdy5TXVJTs.png" alt="Pale Blaze" />
      </div>
      <div class="icon-title">Pale Blaze Website</div>
    </a>

    <a href="https://www.stephensingerart.com/" class="icon-item">
      <div class="icon-link">
        <img src="https://images.squarespace-cdn.com/content/v1/61ee35041ec91a5c394a6fde/1643004107718-KPTIP6OHHK2U90DH8103/05-Singer-Art-21-025_MASTER.jpg?format=750w" alt="Stephen Singer" />
      </div>
      <div class="icon-title">Stephen Singer Website</div>
    </a>

    <a href="https://gallery107.art" class="icon-item">
      <div class="icon-link">
        <img src="https://framerusercontent.com/images/NqMKQRjK8Td4KHxInjsNUyoVo.png" alt="Gallery 107" />
      </div>
      <div class="icon-title">Gallery 107 Website</div>
    </a>
  </div>
  <footer style="margin-top: 4rem; font-size: 0.9rem; color: #555;">
    <a href="https://example.com/checklist" style="color: black; text-decoration: underline;">
      View Exhibition Checklist
    </a>
  </footer>
  <!-- Your content here -->

  <script>
    let timeout;
    const idleTime = 1 * 60 * 1000;

    function resetTimer() {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        window.location.href = 'https://iannoli.github.io/gallery-107/'; // Replace with your homepage URL if needed
      }, idleTime);
    }

    ['click', 'mousemove', 'touchstart', 'keydown'].forEach(evt =>
      window.addEventListener(evt, resetTimer)
    );

    resetTimer(); // Start the timer
  </script>
</body>
</html>
</body>
</html>
