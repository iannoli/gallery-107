<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Architecture of Light + Color</title>
  <style>
    body {
      margin: 0;
      font-family: Helvetica, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: normal;
      margin-bottom: 3rem;
      color: #111;
    }

    .icon-container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }

    .icon-link {
      width: 180px;
      height: 180px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: #f0f0f0;
    }

    .icon-link:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
    }

    .icon-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .icon-title {
      margin-top: 0.75rem;
      font-size: 1rem;
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Architecture of Light + Color</h1>

  <div class="icon-container">
    <a href="https://example.com/link1" class="icon-item" target="_blank">
      <div class="icon-link">
        <img src="https://via.placeholder.com/180?text=1" alt="Pale Blaze" />
      </div>
      <div class="icon-title">Pale Blaze</div>
    </a>

    <a href="https://example.com/link2" class="icon-item" target="_blank">
      <div class="icon-link">
        <img src="https://via.placeholder.com/180?text=2" alt="Stephen Singer" />
      </div>
      <div class="icon-title">Stephen Singer</div>
    </a>

    <a href="https://example.com/link3" class="icon-item" target="_blank">
      <div class="icon-link">
        <img src="https://via.placeholder.com/180?text=3" alt="Exhibition Checklist" />
      </div>
      <div class="icon-title">Exhibition Checklist</div>
    </a>
  </div>
</body>
</html>
