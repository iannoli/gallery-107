<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            text-align: center;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 40px;
        }
        .icon-container {
            display: flex;
            justify-content: center;
        }
        .icon {
            width: 100px;
            height: 100px;
            margin: 20px;
            text-align: center;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: black;
            font-size: 18px;
        }
        .icon img {
            max-width: 80%;
            max-height: 60%;
        }
    </style>
</head>
<body>
    <h1>Welcome!</h1>
    <div class="icon-container">
        <a class="icon" href="URL_TO_PALE_BLAZE">
            <img src="ICON_URL_PALE_BLAZE" alt="Pale Blaze">
            <div>Pale Blaze</div>
        </a>
        <a class="icon" href="URL_TO_STEPEHN_SINGER">
            <img src="ICON_URL_STEPEHN_SINGER" alt="Stephen Singer">
            <div>Stephen Singer</div>
        </a>
        <a class="icon" href="URL_TO_CHECKLIST">
            <img src="ICON_URL_CHECKLIST" alt="Exhibition Checklist">
            <div>Exhibition Checklist</div>
        </a>
    </div>
</body>
</html>
